version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-runtime-and-types:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite-toolchain:
        patterns: ["vite", "@vitejs/plugin-react"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
