name: Browser accessibility and resource checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-shard:
    name: Browser accessibility and resource checks (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: true
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Use the repository npm version
        run: npm install --global npm@12.2.0
      - name: Install locked dependencies
        run: npm ci
      - name: Install the pinned Playwright Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Build production workspaces
        run: npm run build
      - name: Check formatting and workspace types
        run: npm run typecheck
      - name: Check synthetic browser journeys and resource bounds
        run: npm run test:browser -- --shard=${{ matrix.shard }}/2
      - name: Retain synthetic browser evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-browser-evidence-shard-${{ matrix.shard }}-of-2
          path: |
            playwright-report/
            test-results/browser/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

  browser:
    name: Browser accessibility and resource checks
    if: always()
    needs: browser-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every browser shard to pass
        env:
          SHARD_RESULT: ${{ needs.browser-shard.result }}
        run: test "$SHARD_RESULT" = success
