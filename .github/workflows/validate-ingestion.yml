name: Validate ingestion backend

on:
  pull_request:
    paths: ['packages/ingestion/**', 'tests/fixtures/event-replay.json', '.github/workflows/validate-ingestion.yml']
  push:
    branches: [main]
    paths: ['packages/ingestion/**', 'tests/fixtures/event-replay.json', '.github/workflows/validate-ingestion.yml']

permissions:
  contents: read

jobs:
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: leaderboard_ingestion_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: packages/ingestion
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/ingestion/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Embedded PostgreSQL regressions
        run: npm test
      - name: PostgreSQL transactions and concurrent workers
        run: npm test
        env:
          INGESTION_TEST_DATABASE_URL: postgres://postgres:synthetic-test-only@localhost:5432/leaderboard_ingestion_test
