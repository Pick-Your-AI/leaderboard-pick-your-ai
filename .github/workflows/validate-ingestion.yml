name: Validate ingestion backend

on:
  pull_request:
    paths: ['packages/ingestion/**', 'packages/contracts/**', 'package.json', 'package-lock.json', 'tests/fixtures/event-replay.json', '.github/workflows/validate-ingestion.yml']
  push:
    branches: [main]
    paths: ['packages/ingestion/**', 'packages/contracts/**', 'package.json', 'package-lock.json', 'tests/fixtures/event-replay.json', '.github/workflows/validate-ingestion.yml']

permissions:
  contents: read

jobs:
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: leaderboard_ingestion_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Build shared source contracts
        run: npm run build --workspace @pick-your-ai/contracts
      - run: npm run typecheck --workspace @pick-your-ai/ingestion
      - name: Embedded PostgreSQL regressions
        run: npm test --workspace @pick-your-ai/ingestion
      - name: PostgreSQL transactions and concurrent workers
        run: npm test --workspace @pick-your-ai/ingestion
        env:
          INGESTION_TEST_DATABASE_URL: postgres://postgres:synthetic-test-only@localhost:5432/leaderboard_ingestion_test
