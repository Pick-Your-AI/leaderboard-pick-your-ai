name: Runtime scaffold checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: leaderboard
          POSTGRES_PASSWORD: leaderboard
          POSTGRES_DB: leaderboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaderboard -d leaderboard_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://leaderboard:leaderboard@127.0.0.1:5432/leaderboard_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified credential scanner
        shell: bash
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 60 --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks/archive.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Verify credential rejection and scan source
        shell: bash
        run: |
          python3 scripts/secret_scan.py --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks" --self-test
          python3 scripts/secret_scan.py --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        env:
          PIPELINE_SCOPE_STORAGE_TEST_DATABASE_URL: postgres://leaderboard:leaderboard@127.0.0.1:5432/leaderboard_test
      - run: npm run db:validate
      - run: python scripts/validate_plan.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/render_docs.py --check
