name: Validate delivery plan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate structure and mappings
        run: python3 scripts/validate_plan.py
      - name: Exercise validator rejection cases
        run: python3 -m unittest discover -s tests -v
      - name: Check generated documentation
        run: python3 scripts/render_docs.py --check
