name: Validate delivery plan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate structure and mappings
        run: python3 scripts/validate_plan.py
      - name: Exercise validator rejection cases
        run: python3 -m unittest discover -s tests -v
      - name: Check generated documentation
        run: python3 scripts/render_docs.py --check
