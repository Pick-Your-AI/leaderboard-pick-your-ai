name: Publish leaderboard site

# After the "Runtime scaffold checks" workflow succeeds on a push to main, build
# the static web app and publish it to the `site-deploy` branch. The GoDaddy
# host polls that branch (public repo, no credentials) and refreshes the
# leaderboard.pickyour.ai document root.

on:
  workflow_run:
    workflows: ["Runtime scaffold checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run build
      - name: Assemble static site
        run: |
          rm -rf "$RUNNER_TEMP/site"
          cp -r apps/web/dist "$RUNNER_TEMP/site"
          cat > "$RUNNER_TEMP/site/.htaccess" <<'HTACCESS'
          <IfModule mod_headers.c>
            Header always set Content-Security-Policy "frame-ancestors 'none'"
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "no-referrer"
          </IfModule>
          Options -Indexes
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteRule ^api/ - [R=404,L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ /index.html [L]
          </IfModule>
          HTACCESS
          sed -i 's/^          //' "$RUNNER_TEMP/site/.htaccess"
      - name: Publish to site-deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b site-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${SOURCE_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site-deploy
